<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Heard You | Chat Room</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;
    background:
    radial-gradient(circle at top left, rgba(135,111,179,.18), transparent 30%),
    radial-gradient(circle at top right, rgba(70,45,110,.22), transparent 30%),
    radial-gradient(circle at bottom right, rgba(217,194,175,.08), transparent 30%),
    linear-gradient(135deg,#120D1B,#1A1428,#241B37);
}

/* ambient */
.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.12;
}

.g1{
    width:350px;
    height:350px;
    background:#856CB0;
    top:-100px;
    left:-100px;
}

.g2{
    width:280px;
    height:280px;
    background:#D9C2AF;
    right:-80px;
    bottom:-80px;
}

.wrapper{
    position:relative;
    z-index:2;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

/* HEADER */
header{
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.left{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo{
    width:55px;
    height:55px;
    object-fit:contain;
}

.brand h2{
    font-size:20px;
}

.brand p{
    color:#CBBBE7;
    font-size:12px;
    letter-spacing:2px;
}

.right{
    display:flex;
    align-items:center;
    gap:18px;
}

.status{
    display:flex;
    align-items:center;
    gap:10px;
    color:#D8D1E6;
    font-size:14px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#7DFFB5;
    box-shadow:0 0 10px #7DFFB5;
}

/* TIMER */
.timer-box{
    padding:12px 20px;
    border-radius:40px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
    text-align:center;
}

.timer-label{
    font-size:11px;
    color:#BBAFD4;
    letter-spacing:2px;
}

.timer{
    margin-top:4px;
    font-size:24px;
    font-weight:700;
    color:#D9C2AF;
}

.warning{
    color:#ffb86f !important;
}

.danger{
    color:#ff7b7b !important;
}

/* CHAT */
.chat-area{
    flex:1;
    overflow-y:auto;
    padding:35px 8%;
}

.identity{
    text-align:center;
    margin-bottom:35px;
}

.identity span{
    padding:10px 22px;
    border-radius:40px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
    color:#D9C2AF;
    font-size:14px;
}

.message{
    margin-bottom:22px;
}

.received{
    width:fit-content;
    max-width:75%;
    padding:22px;
    border-radius:25px 25px 25px 8px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.06);
    line-height:1.9;
    color:#E6DDF4;
}

.sent{
    margin-left:auto;
    width:fit-content;
    max-width:75%;
    padding:22px;
    border-radius:25px 25px 8px 25px;
    background:linear-gradient(135deg,#5D4A82,#7D68A8);
    line-height:1.9;
}

.typing{
    margin-top:10px;
    color:#BFAFD9;
    font-size:13px;
    font-style:italic;
}

/* INPUT */
.input-box{
    padding:25px 8%;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(20px);
    border-top:1px solid rgba(255,255,255,.06);
}

.safe-note{
    text-align:center;
    color:#A99DBF;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:18px;
}

.input-wrap{
    display:flex;
    gap:15px;
}

textarea{
    flex:1;
    min-height:65px;
    max-height:180px;
    resize:none;
    border:none;
    outline:none;
    padding:18px 22px;
    border-radius:25px;
    font-size:15px;
    color:white;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
}

textarea::placeholder{
    color:#B8AECF;
}

button{
    border:none;
    cursor:pointer;
    padding:18px 32px;
    border-radius:25px;
    font-weight:600;
    color:white;
    transition:.3s;
    background:linear-gradient(135deg,#5D4A82,#866CB0,#B89B8A);
}

button:hover{
    transform:translateY(-2px);
}

button:disabled,
textarea:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* quick reply */
.quick-reply{
    display:flex;
    gap:12px;
    margin-top:15px;
    flex-wrap:wrap;
}

.choice-btn{
    padding:12px 18px;
    border-radius:18px;
    font-size:14px;
}

@media(max-width:768px){
    header{
        padding:18px 20px;
        flex-direction:column;
        gap:15px;
    }

    .right{
        width:100%;
        justify-content:center;
    }

    .chat-area{
        padding:25px 20px;
    }

    .input-box{
        padding:20px;
    }

    .input-wrap{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="glow g1"></div>
<div class="glow g2"></div>

<div class="wrapper">

<header>
    <div class="left">
        <img src="logo.png" class="logo">
        <div class="brand">
            <h2>We Heard You</h2>
            <p>private conversation room</p>
        </div>
    </div>

    <div class="right">
        <div class="status">
            <div class="dot"></div>
            Listener Available
        </div>

        <div class="timer-box">
            <div class="timer-label">SESSION TIME</div>
            <div class="timer" id="timer">30:00</div>
        </div>
    </div>
</header>

<div class="chat-area" id="chatArea">
    <div class="identity">
        <span>Anonymous Soul #204</span>
    </div>

    <div class="message">
        <div class="received">
            Hi, welcome to We Heard You.<br>
            This is your safe room.<br>
            You can start whenever you're ready 🌙
        </div>
        <div class="typing">listener is here to listen…</div>
    </div>
</div>

<div class="input-box">
    <div class="safe-note">
        SAFE SPACE • NO JUDGMENT • PRIVATE
    </div>

    <div class="input-wrap">
        <textarea id="messageInput" placeholder="Tell your story here..."></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

</div>
<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
'https://dhsqzpnemvwmwefqrbkm.supabase.co'

const supabaseKey =
'sb_publishable_WcqyP66rmzlNK3rQJTv49w_yWtOUOmq'

const supabase =
createClient(
  supabaseUrl,
  supabaseKey
)

/* cek auth login */

supabase.auth.onAuthStateChange((event, session) => {

if(session){

console.log('User logged in')

}else{

window.location.href = 'login.html'

}

})

/* tampilkan username */

const username =
sessionStorage.getItem(
'why_username'
) || 'Anonymous Soul'

if(!username){

window.location.href = 'login.html'

}

document.querySelector(
'.identity span'
).innerText =
username

const timerEl = document.getElementById("timer");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const chatArea = document.getElementById("chatArea");

/* load old messages */

async function loadMessages(){

const {
data,
error
}
=
await supabase
.from('messages')
.select('*')
.order('id',{ascending:true})

if(error){

console.log(error)
return

}

data.forEach((msgData)=>{

const msg =
document.createElement('div')

msg.className = 'message'

msg.innerHTML = `
<div class="${
msgData.username === username
? 'sent'
: 'received'
}">
<strong>${msgData.username}</strong><br>
${msgData.message}
</div>
`

chatArea.appendChild(msg)

})

chatArea.scrollTop =
chatArea.scrollHeight

}

/* jalankan load */

loadMessages()

// Daftarkan user ke waiting_rooms
async function registerWaiting(){
    const email = sessionStorage.getItem('why_email') || ''
    
    // Cek apakah sudah terdaftar
    const { data } = await supabase
        .from('waiting_rooms')
        .select('*')
        .eq('username', username)
        .eq('status', 'waiting')
    
    if(data && data.length === 0){
        await supabase
            .from('waiting_rooms')
            .insert([{
                username: username,
                email: email,
                status: 'waiting'
            }])
    }
}

registerWaiting()
    
let timeLeft = 30 * 60;
let extendOfferShown = false;
let sessionEnded = false;

function addSystemMessage(html){
    const msg = document.createElement("div");
    msg.className = "message";
    msg.innerHTML = html;
    chatArea.appendChild(msg);
    chatArea.scrollTop = chatArea.scrollHeight;
}

function extendSession(minutes){
    timeLeft += minutes * 60;
    timerEl.classList.remove("warning","danger");

    addSystemMessage(`
        <div class="received">
            Your session has been extended by ${minutes} minutes 🌙
        </div>
    `);
}

function showExtendOffer(){
    addSystemMessage(`
        <div class="received">
            Your session will end in 3 minutes.<br>
            Would you like to extend your time?
            <div class="quick-reply">
                <button class="choice-btn" onclick="chooseExtend(true)">Iya, aku mau</button>
                <button class="choice-btn" onclick="chooseExtend(false)">No, thanks</button>
            </div>
        </div>
    `);
}

function chooseExtend(answer){
    document.querySelectorAll(".choice-btn").forEach(btn=>btn.disabled=true);

    if(answer){
        addSystemMessage(`<div class="sent">Iya, aku mau</div>`);
        extendSession(30);
        extendOfferShown=false;
    }else{
        addSystemMessage(`<div class="sent">No, thanks</div>`);
    }
}

function showPsychologistOffer(){
    addSystemMessage(`
        <div class="received">
            Before you leave,<br>
            would you like us to recommend a professional psychologist?
            <div class="quick-reply">
                <button class="choice-btn" onclick="choosePsychologist(true)">Iya, aku mau</button>
                <button class="choice-btn" onclick="choosePsychologist(false)">No, thanks</button>
            </div>
        </div>
    `);
}

function choosePsychologist(answer){
    document.querySelectorAll(".choice-btn").forEach(btn=>btn.disabled=true);

    if(answer){
        addSystemMessage(`<div class="sent">Iya, aku mau</div>`);
        setTimeout(()=>window.location.href="psychologist.html",2000);
    }else{
        addSystemMessage(`<div class="sent">No, thanks</div>`);
    }
}

const countdown = setInterval(()=>{
    if(sessionEnded) return;

    const minutes = Math.floor(timeLeft/60);
    const seconds = timeLeft%60;

    timerEl.textContent =
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0');

    if(timeLeft<=180 && !extendOfferShown){
        extendOfferShown=true;
        showExtendOffer();
    }

    if(timeLeft<=0){
        clearInterval(countdown);
        sessionEnded=true;
        input.disabled=true;
        sendBtn.disabled=true;
        sendBtn.textContent="Session Ended";

        addSystemMessage(`
            <div class="received">
                Your session has ended 🌙
            </div>
        `);

        setTimeout(showPsychologistOffer,2000);
    }

    timeLeft--;
},1000);

async function sendMessage(){

    const text = input.value.trim()

    if(text === "") return

    const username =
    sessionStorage.getItem(
    'why_username'
    ) || 'Anonymous Soul'

    const { error } =
    await supabase
    .from('messages')
    .insert([

   {
    username: username,
    email: sessionStorage.getItem('why_email'),
    message: text
   }

    ])

    if(error){

        console.log(error)
        alert('Failed to send message')

        return
    }

    input.value = ""

}

/* realtime messages */

supabase
.channel('chat-room')

.on(
'postgres_changes',
{
event:'INSERT',
schema:'public',
table:'messages'
},
(payload)=>{

const data = payload.new


const msg =
document.createElement('div')

msg.className = 'message'

msg.innerHTML = `
<div class="${
data.username === username
? 'sent'
: 'received'
}">
<strong>${data.username}</strong><br>
${data.message}
</div>
`

chatArea.appendChild(msg)

chatArea.scrollTop =
chatArea.scrollHeight

}

)

.subscribe((status) => {

console.log('Realtime status:', status)

})

window.chooseExtend = chooseExtend
window.choosePsychologist = choosePsychologist
window.sendMessage = sendMessage
    
</script>

</body>
</html>

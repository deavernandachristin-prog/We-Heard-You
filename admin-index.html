<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin We Heard You Dashboard</title>

<style>
:root{
  --bg1:#171320;
  --bg2:#221a33;
  --bg3:#2d2243;
  --glass:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.08);
  --text:rgba(255,255,255,.96);
  --muted:rgba(255,255,255,.70);
  --purple:#b08cff;
  --purple2:#8f6cff;
  --rose:#ffc9dd;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

html,body{
  min-height:100%;
}

body{
  min-height:100vh;
  color:var(--text);
  overflow-x:hidden;
  overflow-y:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:
    radial-gradient(circle at top right, rgba(176,140,255,.18), transparent 35%),
    radial-gradient(circle at bottom left, rgba(255,201,221,.12), transparent 35%),
    linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
}

.moon{
  position:fixed;
  top:-80px;
  right:90px;
  width:280px;
  height:280px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ddd0ff 55%,transparent 72%);
  opacity:.08;
  filter:blur(10px);
  pointer-events:none;
}

.glow1,.glow2,.glow3{
  position:fixed;
  border-radius:50%;
  filter:blur(90px);
  pointer-events:none;
}

.glow1{width:260px;height:260px;left:-80px;bottom:-80px;background:#a27dff;opacity:.12;}
.glow2{width:180px;height:180px;right:18%;bottom:0;background:#ffcde0;opacity:.10;}
.glow3{width:160px;height:160px;left:20%;top:10%;background:#c6b3ff;opacity:.07;}

.login-wrap{
  width:100%;
  max-width:520px;
  position:relative;
  z-index:2;
}

.login-card{
  padding:38px;
  border-radius:32px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
  box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.brand{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  width:78px;
  height:78px;
  border-radius:24px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:linear-gradient(135deg,#c7a9ff,#8f6cff);
  box-shadow:0 14px 34px rgba(143,108,255,.35);
}

.brand h1{font-size:28px;margin-bottom:10px;line-height:1.35;}
.brand p{color:var(--muted);line-height:1.8;font-size:14px;}
.quote{margin-top:14px;font-style:italic;font-size:13px;color:rgba(255,255,255,.60);}

.form-group{margin-bottom:18px;}

label{display:block;margin-bottom:9px;color:var(--muted);font-size:14px;}

input{
  width:100%;
  padding:15px 16px;
  border:none;
  outline:none;
  border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.06);
  color:white;
  font-size:14px;
  transition:.25s;
}

input:focus{
  border-color:rgba(176,140,255,.6);
  box-shadow:0 0 0 4px rgba(176,140,255,.10);
}

input::placeholder{color:rgba(255,255,255,.38);}

.error-msg{
  margin-top:10px;
  padding:12px 16px;
  border-radius:12px;
  background:rgba(255,100,100,.12);
  border:1px solid rgba(255,100,100,.2);
  color:#ffaaaa;
  font-size:13px;
  display:none;
}

button{
  width:100%;
  border:none;
  cursor:pointer;
  padding:16px;
  border-radius:16px;
  font-size:15px;
  font-weight:700;
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  box-shadow:0 16px 34px rgba(143,108,255,.30);
  transition:.25s;
  margin-top:8px;
}

button:hover{transform:translateY(-2px);box-shadow:0 22px 40px rgba(143,108,255,.36);}
button:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.footer{
  margin-top:22px;
  text-align:center;
  color:rgba(255,255,255,.45);
  font-size:12px;
  line-height:1.7;
}
</style>
</head>
<body>

<div class="moon"></div>
<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<div class="login-wrap">
  <div class="login-card">

    <div class="brand">
      <div class="logo">☾</div>
      <h1>Admin We Heard You Dashboard</h1>
      <p>Welcome back. Enter the portal and continue creating a safe, gentle space for someone who needs to be heard.</p>
      <div class="quote">"thank you for being a safe space for someone today."</div>
    </div>

    <div class="form-group">
      <label>Email Admin</label>
      <input type="email" id="email" placeholder="Enter admin email">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>

    <div class="form-group">
      <label>Your Listener Name</label>
      <input type="text" id="listenerName" placeholder="ex: Sakura, Luna, Aurora...">
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button id="loginBtn" onclick="adminLogin()">Enter Dashboard</button>

    <div class="footer">
      We Heard You • Internal Admin Access Only
    </div>

  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl = 'https://dhsqzpnemvwmwefqrbkm.supabase.co'
const supabaseKey = 'sb_publishable_WcqyP66rmzlNK3rQJTv49w_yWtOUOmq'
const supabase = createClient(supabaseUrl, supabaseKey)

window.adminLogin = async function() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value.trim()
  const listenerName = document.getElementById('listenerName').value.trim()
  const btn = document.getElementById('loginBtn')
  const errorMsg = document.getElementById('errorMsg')

  errorMsg.style.display = 'none'

  if(!email || !password || !listenerName) {
    errorMsg.textContent = 'Semua field harus diisi!'
    errorMsg.style.display = 'block'
    return
  }

  btn.disabled = true
  btn.textContent = 'Entering...'

  const { data, error } = await supabase.auth.signInWithPassword({
    email: email,
    password: password
  })

  if(error) {
    errorMsg.textContent = 'Email atau password salah!'
    errorMsg.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Enter Dashboard'
    return
  }

  // Simpan listener name ke sessionStorage
  sessionStorage.setItem('why_listener_name', listenerName)
  sessionStorage.setItem('why_is_admin', 'true')

  window.location.href = 'admin-Dashboard.html'
}
</script>

</body>
</html>

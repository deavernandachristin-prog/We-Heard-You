<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>We Heard You — Payment Verification</title>
<style>
*{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top left,#31104b 0%,#130821 45%,#0b0416 100%);color:#fff;overflow:hidden;position:relative}
.star{position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;box-shadow:0 0 12px #fff;opacity:.85}
.card{width:100%;max-width:500px;padding:34px;border-radius:28px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(149,46,224,.25);text-align:center;position:relative;z-index:2}
.brand{font-size:14px;color:#decfea;letter-spacing:1px;margin-bottom:10px}
h1{margin:0;font-size:34px}.subtitle{color:#decfea;line-height:1.7;margin:12px 0 24px}
.qr{width:220px;height:220px;margin:0 auto 20px;border-radius:20px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);font-size:18px;color:#decfea}
.timer{font-size:42px;font-weight:800;margin:8px 0;background:linear-gradient(90deg,#7a2cf2,#c92bd8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.status{margin-top:18px;padding:14px;border-radius:16px;background:rgba(255,255,255,.05);color:#decfea;line-height:1.6}
.bar{width:100%;height:10px;background:rgba(255,255,255,.08);border-radius:99px;margin-top:20px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#7a2cf2,#c92bd8);transition:width 1s linear}
</style>
</head>
<body>
<div class="star" style="top:8%;left:18%"></div>
<div class="star" style="top:18%;right:16%"></div>
<div class="star" style="bottom:22%;left:12%"></div>
<div class="star" style="bottom:14%;right:20%"></div>

<div class="card">
<div class="brand">WE HEARD YOU</div>
<h1>Payment Verification</h1>
<p class="subtitle">Complete your payment to continue into your safe space. QR code is valid for 1 minute.</p>
<div class="qr">QR PAYMENT CODE</div>
<div class="timer" id="timer">01:00</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="status">Waiting for payment confirmation...</div>
</div>
<script>
let timeLeft=60;
const timer=document.getElementById('timer');
const fill=document.getElementById('fill');
const status=document.getElementById('status');
const interval=setInterval(()=>{
  timeLeft--;
  const m=String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s=String(timeLeft%60).padStart(2,'0');
  timer.textContent=`${m}:${s}`;
  fill.style.width=(timeLeft/60*100)+'%';

  if(timeLeft===30){
    status.innerHTML='Payment verified successfully ✨<br>Redirecting you to Anonymous Login...';
    setTimeout(()=>{ window.location.href='login.html'; },1500);
    clearInterval(interval);
  }

  if(timeLeft<=0){
    clearInterval(interval);
    status.textContent='QR code expired. Please refresh to generate a new code.';
  }
},1000);
</script>
</body>
</html>

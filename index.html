<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Heard You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      overflow-y:auto;
      color:white;
      background:
      radial-gradient(circle at top left, rgba(146,84,255,.20), transparent 30%),
      radial-gradient(circle at top right, rgba(255,102,196,.10), transparent 25%),
      radial-gradient(circle at bottom center, rgba(120,86,255,.15), transparent 30%),
      linear-gradient(135deg,#05020a,#0c0416,#140822,#1a0b2d,#12061d);
      position:relative;
    }

    .stars{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    .stars span{
      position:absolute;
      width:3px;
      height:3px;
      border-radius:50%;
      background:white;
      box-shadow:0 0 10px white;
      animation:blink 3s infinite alternate;
      opacity:.7;
    }

    @keyframes blink{
      from{
        opacity:.2;
        transform:scale(.8);
      }
      to{
        opacity:1;
        transform:scale(1.2);
      }
    }

    .blob{
      position:fixed;
      border-radius:50%;
      filter:blur(120px);
      opacity:.25;
      z-index:0;
      animation:float 10s infinite alternate ease-in-out;
      pointer-events:none;
    }

    .b1{
      width:350px;
      height:350px;
      background:#7c3aed;
      left:-80px;
      top:-80px;
    }

    .b2{
      width:420px;
      height:420px;
      background:#d946ef;
      right:-120px;
      top:120px;
      animation-delay:2s;
    }

    .b3{
      width:320px;
      height:320px;
      background:#8b5cf6;
      bottom:-100px;
      left:35%;
      animation-delay:1s;
    }

    @keyframes float{
      from{transform:translate(0,0);}
      to{transform:translate(25px,35px);}
    }

    nav{
      width:100%;
      padding:22px 7%;
      position:relative;
      z-index:2;
    }

    .brand{
      font-size:22px;
      font-weight:600;
      color:#f5eaff;
      text-shadow:0 0 18px rgba(185,131,255,.35);
      letter-spacing:.3px;
    }

    .hero{
      min-height:calc(100vh - 80px);
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px 30px 50px;
      position:relative;
      z-index:2;
    }

    .content{
      width:100%;
      max-width:820px;
      animation:fadeUp 1.1s ease;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(35px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo-wrap{
      width:230px;
      height:230px;
      margin:auto;
      margin-bottom:28px;
      border-radius:28px;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      box-shadow:
      0 0 50px rgba(168,85,247,.16),
      inset 0 0 20px rgba(255,255,255,.03);
    }

    .logo-wrap::before{
      content:"";
      position:absolute;
      width:300px;
      height:300px;
      border-radius:40px;
      background:radial-gradient(circle, rgba(185,131,255,.18), transparent 65%);
      z-index:-1;
      animation:pulse 4s infinite;
    }

    @keyframes pulse{
      0%{transform:scale(1); opacity:.5;}
      50%{transform:scale(1.06); opacity:.9;}
      100%{transform:scale(1); opacity:.5;}
    }

    .logo-wrap img{
      width:82%;
      height:82%;
      object-fit:contain;
      filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
    }

    h1{
      font-size:54px;
      margin-bottom:14px;
      font-weight:800;
      background:linear-gradient(to right,#fff,#e9d5ff,#f5d0fe);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      max-width:620px;
      margin:auto;
      margin-bottom:28px;
      line-height:1.8;
      color:rgba(255,255,255,.82);
      font-size:15px;
    }

    .btn{
      display:inline-block;
      text-decoration:none;
      padding:15px 34px;
      border-radius:40px;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
      color:white;
      background:linear-gradient(90deg,#6d28d9,#9333ea,#c026d3);
      box-shadow:0 0 25px rgba(168,85,247,.25);
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 0 35px rgba(168,85,247,.35);
    }

    @media(max-width:768px){
      .brand{
        font-size:18px;
      }

      .logo-wrap{
        width:180px;
        height:180px;
      }

      .logo-wrap::before{
        width:240px;
        height:240px;
      }

      h1{
        font-size:38px;
      }

      p{
        font-size:14px;
      }
    }
  </style>
</head>

<body>

  <div class="stars">
    <span style="top:10%;left:20%"></span>
    <span style="top:22%;left:70%"></span>
    <span style="top:65%;left:15%"></span>
    <span style="top:78%;left:80%"></span>
    <span style="top:40%;left:50%"></span>
    <span style="top:15%;left:88%"></span>

  <section class="hero">
    <div class="content">

      <p>
        This is a comforting digital space where feelings are welcomed,

        We listen, we care, and we hear you.
      </p>

      <a href="homepage.html" class="btn">Let's Get In!</a>

    </div>
  </section>

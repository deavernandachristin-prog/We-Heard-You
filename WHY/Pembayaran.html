<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - We-Heard-You</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f8f3e9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#5e4632;
}

.container{
background:white;
max-width:430px;
width:100%;
padding:35px;
border-radius:24px;
box-shadow:0 15px 30px rgba(0,0,0,0.08);
text-align:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#8b6b4a;
margin-bottom:10px;
}

h1{
font-size:24px;
margin-bottom:10px;
}

.desc{
color:#777;
line-height:1.6;
margin-bottom:20px;
}

.price-box{
background:#f4ece2;
padding:18px;
border-radius:18px;
margin-bottom:25px;
}

.price-title{
font-size:14px;
color:#888;
margin-bottom:8px;
}

.price{
font-size:34px;
font-weight:bold;
color:#8b6b4a;
}

.qr-box{
background:#fff;
border:2px dashed #d8c6b3;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

.qr-box img{
width:230px;
max-width:100%;
border-radius:12px;
}

.note{
font-size:14px;
color:#777;
line-height:1.5;
margin-bottom:25px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#8b6b4a;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#705338;
}

.back{
display:block;
margin-top:15px;
text-decoration:none;
color:#8b6b4a;
font-size:14px;
}

.timer{
margin-top:15px;
font-size:13px;
color:#999;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">WHY</div>

<h1>Pembayaran Sesi Curhat</h1>

<p class="desc">
Silakan scan QRIS di bawah ini untuk memulai sesi chat anonim selama 30 menit.
</p>

<div class="price-box">
<div class="price-title">Total Pembayaran</div>
<div class="price">Rp15.000</div>
</div>

<div class="qr-box">

<!-- GANTI qris.png dengan gambar QRIS kamu -->
<img src="qris.png" alt="QRIS Payment">

</div>

<p class="note">
Setelah pembayaran selesai, klik tombol di bawah untuk masuk ke room chat pribadi kamu.
</p>

<button onclick="window.location.href='Berhasil bayar.html'">
Saya Sudah Bayar
</button>

<a href="Berhasil bayar.html" class="back"></a>

<div class="timer">
QR berlaku selama sesi tersedia
</div>

</div>

</body>
</html>

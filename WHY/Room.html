<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Chat - We-Heard-You</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f8f3e9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:20px;
}

.chat-container{
background:white;
width:100%;
max-width:500px;
height:90vh;
border-radius:22px;
box-shadow:0 12px 25px rgba(0,0,0,0.08);
display:flex;
flex-direction:column;
overflow:hidden;
}

.header{
background:#8b6b4a;
color:white;
padding:18px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.sub{
font-size:13px;
margin-top:5px;
opacity:0.9;
}

.chat-box{
flex:1;
padding:20px;
overflow-y:auto;
background:#f5ede4;
}

.msg{
padding:12px 15px;
margin-bottom:12px;
border-radius:16px;
max-width:75%;
line-height:1.5;
}

.admin{
background:#8b6b4a;
color:white;
}

.user{
background:white;
margin-left:auto;
}

.input-area{
display:flex;
padding:15px;
gap:10px;
background:white;
border-top:1px solid #eee;
}

input{
flex:1;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
}

button{
padding:14px 18px;
border:none;
background:#8b6b4a;
color:white;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#6f5339;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">
We-Heard-You
<div class="sub">Anonim</div>
</div>

<div class="chat-box" id="chatBox">

<div class="msg admin">
Halo 😊 terima kasih sudah datang. Cerita pelan-pelan ya, aku siap mendengar.
</div>

</div>

<div class="input-area">
<input type="text" id="messageInput" placeholder="Tulis pesan...">
<button onclick="sendMessage()">Kirim</button>
</div>

</div>

<script>
function sendMessage(){

let input = document.getElementById("messageInput");
let text = input.value.trim();

if(text !== ""){

let chatBox = document.getElementById("chatBox");

chatBox.innerHTML += `
<div class="msg user">${text}</div>
`;

chatBox.scrollTop = chatBox.scrollHeight;

setTimeout(function(){

chatBox.innerHTML += `
<div class="msg admin">Terima kasih sudah berbagi. Aku mendengarkan kamu.</div>
`;

chatBox.scrollTop = chatBox.scrollHeight;

},1000);

input.value="";

}

}
</script>

</body>
</html>

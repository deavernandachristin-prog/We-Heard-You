<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran Berhasil - We-Heard-You</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f8f3e9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#5e4632;
}

.container{
background:white;
max-width:430px;
width:100%;
padding:40px 30px;
border-radius:24px;
box-shadow:0 15px 30px rgba(0,0,0,0.08);
text-align:center;
animation:fadeUp 0.8s ease;
}

.icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#e7f8ea;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
margin-bottom:20px;
}

.logo{
font-size:28px;
font-weight:bold;
color:#8b6b4a;
margin-bottom:10px;
}

h1{
font-size:28px;
margin-bottom:12px;
}

.desc{
font-size:15px;
color:#777;
line-height:1.7;
margin-bottom:25px;
}

.info-box{
background:#f4ece2;
padding:18px;
border-radius:18px;
margin-bottom:25px;
text-align:left;
}

.info-box p{
margin-bottom:10px;
font-size:14px;
}

.info-box p:last-child{
margin-bottom:0;
}

.btn{
display:block;
width:100%;
padding:15px;
background:#8b6b4a;
color:white;
text-decoration:none;
border-radius:14px;
font-weight:bold;
transition:0.3s;
margin-bottom:12px;
}

.btn:hover{
background:#705338;
transform:translateY(-3px);
}

.secondary{
background:white;
color:#8b6b4a;
border:1px solid #8b6b4a;
}

.secondary:hover{
background:#f7f1ea;
}

.note{
font-size:13px;
color:#999;
margin-top:10px;
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="container">

<div class="icon">✓</div>

<div class="logo">WHY</div>

<h1>Pembayaran Berhasil</h1>

<p class="desc">
Terima kasih. Pembayaran kamu telah diterima dan sesi chat siap dimulai.
</p>

<div class="info-box">
<p><b>Status:</b> Berhasil</p>
<p><b>Paket:</b> Sesi Chat 30 Menit</p>
<p><b>Total:</b> Rp15.000</p>
</div>

<a href="Room.html" class="btn">Masuk Room Chat</a>

<a href="Room.html" class="btn secondary">Kembali ke Beranda</a>

<div class="note">
Silakan masuk ke room chat untuk memulai sesi.
</div>

</div>

</body>
</html>
